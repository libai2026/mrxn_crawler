name: Crawl mrxn jswz

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: mrxn-jswz-archive
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (verbose)
        run: |
          set -euxo pipefail
          python -VV
          python -m pip --version
          python -m pip install --upgrade pip
          pip install -r requirements.txt -v
          python -m playwright install --with-deps chromium

      - name: Prepare target branch
        run: |
          set -euxo pipefail
          git fetch --all --prune
          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -B "${TARGET_BRANCH}"
          fi
          git status --short --branch

      - name: Use crawler code from trigger commit
        run: |
          set -euxo pipefail
          git checkout "${GITHUB_SHA}" -- scripts/crawl_mrxn_jswz.py requirements.txt README.md

      - name: Crawl articles
        run: |
          set -euxo pipefail
          rm -rf output/jswz
          python scripts/crawl_mrxn_jswz.py \
            --output output/jswz \
            --delay 1.0 \
            --min-interval 1.8 \
            --max-retries 8 \
            --base-backoff 2.0
          test -f output/jswz/manifest.json
          test -f output/jswz/crawl_report.json
          find output/jswz -maxdepth 4 -type f | sort | sed -n '1,300p'

      - name: Package and upload crawl artifact
        run: |
          set -euxo pipefail
          tar -czf jswz-output.tgz output/jswz
          ls -lh jswz-output.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: jswz-output
          path: |
            jswz-output.tgz
            output/jswz/manifest.json
            output/jswz/crawl_report.json
          if-no-files-found: error

      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/jswz
          if git diff --cached --quiet; then
            echo "No updates"
            exit 0
          fi
          git commit -m "chore: update jswz markdown archive"
          git push origin "${TARGET_BRANCH}"
