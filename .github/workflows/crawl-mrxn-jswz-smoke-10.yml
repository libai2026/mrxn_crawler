name: Crawl mrxn jswz (smoke 10)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-smoke-10:
    runs-on: ubuntu-latest
    env:
      SMOKE_BRANCH: mrxn-jswz-smoke10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare smoke branch
        run: |
          set -euxo pipefail
          git fetch --all --prune
          if git ls-remote --exit-code --heads origin "${SMOKE_BRANCH}" >/dev/null 2>&1; then
            git checkout -B "${SMOKE_BRANCH}" "origin/${SMOKE_BRANCH}"
          else
            git checkout -B "${SMOKE_BRANCH}"
          fi

      - name: Use crawler code from trigger commit
        run: |
          set -euxo pipefail
          git checkout "${GITHUB_SHA}" -- scripts/crawl_mrxn_jswz.py requirements.txt README.md

      - name: Run smoke crawl (10 articles)
        run: |
          set -euxo pipefail
          rm -rf output/jswz-smoke10
          python scripts/crawl_mrxn_jswz.py \
            --output output/jswz-smoke10 \
            --max-articles 10 \
            --delay 0.6 \
            --min-interval 1.2 \
            --max-retries 6 \
            --base-backoff 1.5
          test -f output/jswz-smoke10/manifest.json
          test -f output/jswz-smoke10/crawl_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/jswz-smoke10/manifest.json').read_text(encoding='utf-8'))
          print('manifest_count=', len(data))
          if len(data) > 10:
              raise SystemExit('manifest_count exceeds 10')
          PY
          find output/jswz-smoke10 -maxdepth 4 -type f | sort | sed -n '1,220p'


      - name: Debug base64 image sizes in markdown
        run: |
          set -euxo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          md_dir = Path('output/jswz-smoke10/markdown')
          pattern = re.compile(r'data:image/[^;]+;base64,([A-Za-z0-9+/=]+)')

          total_images = 0
          total_b64_chars = 0
          largest = (None, 0)

          for md in sorted(md_dir.glob('*.md')):
              text = md.read_text(encoding='utf-8', errors='ignore')
              matches = pattern.findall(text)
              if not matches:
                  print(f"[DEBUG] {md.name}: base64_images=0")
                  continue

              sizes = [len(m) for m in matches]
              total_images += len(sizes)
              total_b64_chars += sum(sizes)
              local_max = max(sizes)
              if local_max > largest[1]:
                  largest = (md.name, local_max)

              print(
                  f"[DEBUG] {md.name}: base64_images={len(sizes)}, "
                  f"sum_chars={sum(sizes)}, max_chars={local_max}, min_chars={min(sizes)}"
              )

          print(f"[DEBUG] base64_total_images={total_images}")
          print(f"[DEBUG] base64_total_chars={total_b64_chars}")
          if largest[0]:
              print(f"[DEBUG] base64_largest={largest[0]}:{largest[1]} chars")
          PY
      - name: Package and upload artifact
        run: |
          set -euxo pipefail
          tar -czf jswz-smoke10-output.tgz output/jswz-smoke10
      - uses: actions/upload-artifact@v4
        with:
          name: jswz-smoke10-output
          path: |
            jswz-smoke10-output.tgz
            output/jswz-smoke10/manifest.json
            output/jswz-smoke10/crawl_report.json
          if-no-files-found: error

      - name: Commit and push smoke output branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/jswz-smoke10
          if git diff --cached --quiet; then
            echo "No smoke output changes"
            exit 0
          fi
          git commit -m "chore: update smoke10 crawl output"
          git push origin "${SMOKE_BRANCH}"
